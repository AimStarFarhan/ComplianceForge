# ComplianceForge synthetic Juniper SRX config — COMPLIANT baseline (set-style)
# Synthetic fixture inspired by public Junos CLI reference syntax. Not a real device config.
set system host-name SRX-FW-01
set system time-zone America/New_York
set system root-authentication encrypted-password "$6$rounds=5000$salt$hashedvalue"
set system login message "Authorized access only. All activity is monitored."
set system login user netadmin class super-user authentication encrypted-password "$6$rounds=5000$salt$hashed"
set system login class SUPER idle-timeout 10
set system login password minimum-length 12
set system login retry-options tries-before-disconnect 3
set system authentication-order [ radius password ]
set system radius-server 10.20.30.40 secret "$9$hashed-secret-string"
set system accounting events [ login change-log ]
set system services ssh protocol-version v2
set system services ssh root-login deny
set system ports console log-out-on-disconnect
set system ntp server 10.10.1.1
set system ntp server 10.10.1.2
set system syslog host 10.20.30.41 authorization info
set system syslog host 10.20.30.41 daemon info
set system syslog file interactive interactive-commands any
set system syslog file authlog authorization info
set security ssh_host_protocol_v2
set security ike proposal P-STD authentication-method pre-shared-keys dh-group group14 encryption-algorithm aes-256-cbc
set security policies default-policy deny-all
set security policies from-zone untrust to-zone trust policy BLOCK-BAD then deny
set security policies from-zone untrust to-zone trust policy BLOCK-BAD then log session-close
set snmp community Xk91Read0nlyStr1ng authorization read-only
set interfaces ge-0/0/0 unit 0 family inet address 10.10.10.1/24
set interfaces ge-0/0/1 unit 0 family inet address 10.10.20.2/24
set routing-options static route 0.0.0.0/0 next-hop 10.10.10.254
