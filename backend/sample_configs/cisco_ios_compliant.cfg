! ComplianceForge synthetic Cisco IOS config — COMPLIANT baseline
! Synthetic fixture inspired by public vendor CLI reference syntax. Not a real device config.
version 15.2
hostname CORE-SW-01
!
no ip http server
ip http secure-server
!
ip domain-name corp.internal
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-HOSTS in
 login local
!
ip access-list standard MGMT-HOSTS
 permit 10.10.10.0 0.0.0.255
 deny any log
!
banner motd #Authorized access only. All activity is monitored and logged.#
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa accounting exec default start-stop local
!
security passwords min-length 12
service password-encryption
enable secret 5 $1$mERr$q.Lhd8pBhP3ZBprQbOc0X.
username netadmin privilege 15 secret 5 $1$mERr$hx5wVhaK7AmXn7YQCN4e30
login block-for 120 attempts 3 within 60
!
logging host 10.20.30.40
logging trap informational
logging buffered 64000
service timestamps log datetime msec
!
archive
 log config
  logging enable
  notify syslog
!
no cdp run
no lldp run
no service tcp-small-servers
no service udp-small-servers
no ip finger
no ip bootp server
no service pad
no service config
no ip source-route
no ip domain-lookup
!
ntp server 10.10.1.1
ntp server 10.10.1.2 prefer
!
snmp-server community S3cr3tStr1ng-Xk91 RO MGMT-HOSTS
!
interface GigabitEthernet0/1
 description UPLINK-TO-CORE
 ip address 10.10.20.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description MGMT
 ip address 10.10.10.5 255.255.255.0
 no shutdown
!
end
