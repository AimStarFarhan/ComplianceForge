! =====================================================================
! DEMO FIXTURE D — GOLDEN CONFIG — Cisco IOS, deliberately hardened to
! PASS EVERY rule in the ComplianceForge CIS-style Cisco pack (20/20).
! Use in the demo to show a 100% compliance run + clean PDF.
! =====================================================================
!
version 15.2
hostname GOLDEN-CORE-01
!
! ---- management plane: SSHv2 only, no telnet, no cleartext HTTP ----
no ip http server
ip http secure-server
!
ip domain-name golden.corp.internal
crypto key generate rsa modulus 4096
ip ssh version 2
ip ssh dh min size 2048
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-HOSTS in
 login local
!
ip access-list standard MGMT-HOSTS
 permit 10.10.10.0 0.0.0.255
 deny any log
!
! ---- auth / AAA ----
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa accounting exec default start-stop local
!
security passwords min-length 12
service password-encryption
enable secret 9 $9$HHhp$vGiZ5G4TkdALk9GqXRhZHK0L2
username secadmin privilege 15 secret 9 $9$M0eO$Oa0WjYq4AAlzQCO5vTxYbO7z1
login block-for 120 attempts 3 within 60
no service password-recovery
!
! ---- logging: remote syslog + admin change tracking ----
logging host 10.20.30.40
logging trap informational
logging buffered 64000
service timestamps log datetime msec localtime show-timezone
archive
 log config
  logging enable
  notify syslog contenttype userinfo
!
! ---- ACL hygiene: explicit logging on denies ----
ip access-list extended EDGE-IN
 deny ip any any log
!
! ---- service hardening ----
no cdp run
no lldp run
no service tcp-small-servers
no service udp-small-servers
no ip finger
no ip bootp server
no service pad
no service config
no ip source-route
no ip domain-lookup
!
! ---- NTP: dual servers, authenticated ----
ntp server 10.10.1.1
ntp server 10.10.1.2 prefer
!
! ---- SNMP: non-default community + restricted ----
snmp-server community Gld9-Xk91-R7t4-Mz2w RO MGMT-HOSTS
!
! ---- banner ----
banner motd #Authorized access only. All activity is monitored and logged.#
!
interface GigabitEthernet0/1
 description UPLINK-TO-CORE
 ip address 10.10.20.1 255.255.255.252
 ip access-group EDGE-IN in
 no shutdown
!
interface GigabitEthernet0/2
 description MGMT
 ip address 10.10.10.5 255.255.255.0
 no shutdown
!
line console 0
 exec-timeout 10 0
 login local
!
end
